<!-- Este es el favicon que usan las siete páginas. Es el logo con un filete
     oscuro alrededor, que es lo que le hace falta para recortarse contra los
     fondos claros: la pestaña del navegador, un marcador, una firma de correo.
     Sin filete, el azul del marco se funde con el blanco y el icono pierde su
     silueta. El logo sin filete sigue en favicon.svg, para fondos oscuros.

     El dibujo se recorta 0,35 hacia dentro y el filete se pinta encima,
     centrado justo en ese corte. Así el canto del color queda por debajo de la
     línea, tapado, y por fuera de ella no hay nada. Recortar y pintar el filete
     en el mismo sitio no bastaba: los dos bordes se suavizan y el color se
     colaba por el difuminado. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="El Escaparate">
  <defs>
    <clipPath id="marco"><rect x="0.35" y="0.35" width="63.3" height="63.3" rx="6.65"/></clipPath>
    <clipPath id="cristal"><rect x="7" y="20.5" width="50" height="36" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#marco)">
    <rect width="64" height="64" fill="#0b2350"/>
    <rect x="4.5" y="18" width="55" height="41" rx="6" fill="#06152f"/>
    <rect x="7" y="20.5" width="50" height="36" rx="4" fill="#8ba5cd"/>
    <g clip-path="url(#cristal)">
      <polygon points="54,18 60,18 60,60 30,60" fill="#9db4d8"/>
      <polygon points="42,18 54,18 30,60 18,60" fill="#a9bdd9"/>
    </g>
    <path d="M46 29c.6 4.2 1.8 5.4 6 6-4.2.6-5.4 1.8-6 6-.6-4.2-1.8-5.4-6-6 4.2-.6 5.4-1.8 6-6Z" fill="#eaeef2"/>
    <path d="M0 0h64v21a6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0Z" fill="#06152f"/>
    <path d="M0 0h64v18.8a6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0 6.4 6.4 0 0 1-12.8 0Z" fill="#eaeef2"/>
    <path d="M0 0h12.8v18.8a6.4 6.4 0 0 1-12.8 0Z" fill="#ff5c3a"/>
    <path d="M25.6 0h12.8v18.8a6.4 6.4 0 0 1-12.8 0Z" fill="#ff5c3a"/>
    <path d="M51.2 0h12.8v18.8a6.4 6.4 0 0 1-12.8 0Z" fill="#ff5c3a"/>
  </g>

  <!-- Misma forma que el recorte y sin recortar: el trazo se reparte 0,35
       hacia fuera y 0,35 hacia dentro, y esa mitad de dentro es la que tapa el
       canto del color. -->
  <rect x="0.35" y="0.35" width="63.3" height="63.3" rx="6.65" fill="none" stroke="#0d1726" stroke-width="0.7"/>
</svg>
